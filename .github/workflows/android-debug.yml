name: Android debug APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name yasser_barber --org com.yasser .

      - name: Configure local notification receivers
        run: python3 tool/prepare_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Check Supabase build configuration
        if: github.event_name != 'pull_request'
        id: config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          BARBER_ID: ${{ vars.BARBER_ID }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ] && [ -n "$BARBER_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, and BARBER_ID to build a connected APK."
          fi

      - name: Build debug APK
        if: github.event_name != 'pull_request' && steps.config.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          BARBER_ID: ${{ vars.BARBER_ID }}
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          --dart-define=BARBER_ID="$BARBER_ID"

      - name: Build unconfigured debug APK
        if: github.event_name != 'pull_request' && steps.config.outputs.configured != 'true'
        run: flutter build apk --debug

      - name: Upload debug APK
        if: github.event_name != 'pull_request' && steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clientes-de-barberia-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload unconfigured debug APK
        if: github.event_name != 'pull_request' && steps.config.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clientes-de-barberia-debug-apk-sin-supabase
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
