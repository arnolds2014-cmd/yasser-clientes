name: Android debug APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name yasser_barber --org com.yasser .

      - name: Configure Firebase Android app
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          if [ -n "$FIREBASE_CONFIG_JSON" ]; then
            printf '%s' "$FIREBASE_CONFIG_JSON" > android/app/google-services.json
          fi

      - name: Configure local notification receivers
        run: python3 tool/prepare_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Check Supabase build configuration
        if: github.event_name != 'pull_request'
        id: config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
          BARBER_ID: ${{ vars.BARBER_ID }}
        run: |
          missing=""
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY BARBER_ID FIREBASE_CONFIG_JSON; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Missing GitHub Actions configuration:${missing}"
          fi

      - name: Stop if connected build configuration is missing
        if: github.event_name != 'pull_request' && steps.config.outputs.configured != 'true'
        run: |
          echo "Configure the missing repository secrets/variable listed above, then run this workflow again."
          exit 1

      - name: Validate Firebase Android configuration
        if: github.event_name != 'pull_request' && steps.config.outputs.configured == 'true'
        run: |
          python3 -c "import json; d=json.load(open('android/app/google-services.json', encoding='utf-8')); assert d['client'][0]['client_info']['android_client_info']['package_name'] == 'com.yasser.yasser_barber', 'Firebase package name must be com.yasser.yasser_barber'"

      - name: Build debug APK
        if: github.event_name != 'pull_request' && steps.config.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
          BARBER_ID: ${{ vars.BARBER_ID }}
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          --dart-define=BARBER_ID="$BARBER_ID"

      - name: Upload debug APK
        if: github.event_name != 'pull_request' && steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clientes-de-barberia-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
